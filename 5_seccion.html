<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menú Principal</title>

    <link rel="stylesheet" href="5_seccion.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

    <!-- ENCABEZADO -->
    <header class="header">

        <div class="iconos">

            <a class="boton-icono" href="6_seccion.html">
                <i class="fa-solid fa-user"></i>
            </a>

            <a class="boton-icono" href="7_seccion.html">
                <i class="fa-solid fa-bell"></i>
            </a>

        </div>

        <input
            type="text"
            id="buscar"
            placeholder="Buscar materia...">

    </header>


    <!-- TÍTULO -->
    <h1>Menú Principal</h1>


    <!-- MATERIAS -->
    <main class="grid">

        <!-- MATERIA NUEVA -->
        <a class="card nueva" href="8_seccion.html">

            <div class="icono-mas">
                <i class="fa-solid fa-plus"></i>
            </div>

            <p>Materia Nueva</p>

        </a>


        <!-- FÍSICA -->
        <a class="card" href="18_seccion.html">

            <div class="icono-materia">
                <i class="fa-solid fa-atom"></i>
            </div>

            <p>Física</p>

        </a>


        <!-- QUÍMICA -->
        <a class="card" href="27_seccion.html">

            <div class="icono-materia">
                <i class="fa-solid fa-flask"></i>
            </div>

            <p>Química</p>

        </a>


        <!-- ARTÍSTICA -->
        <a class="card" href="9_seccion.html">

            <div class="icono-materia">
                <i class="fa-solid fa-palette"></i>
            </div>

            <p>Artística</p>

        </a>


        <!-- MATEMÁTICAS -->
        <div class="card">

            <div class="icono-materia">
                <i class="fa-solid fa-square-root-variable"></i>
            </div>

            <p>Matemáticas</p>

        </div>


        <!-- FILOSOFÍA -->
        <div class="card">

            <div class="icono-materia">
                <i class="fa-solid fa-book-open"></i>
            </div>

            <p>Filosofía</p>

        </div>

    </main>

</div>


<script>

const buscador = document.getElementById("buscar");

buscador.addEventListener("keyup", function(){

    const texto = this.value.toLowerCase();

    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {

        const nombre = card.innerText.toLowerCase();

        if(nombre.includes(texto)){
            card.style.display = "flex";
        }else{
            card.style.display = "none";
        }

    });

});

</script>

</body>
</html>
