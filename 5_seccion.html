<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduConnect - Menú Principal</title>

    <link rel="stylesheet" href="5_seccion.css">
</head>

<body>

    <main class="telefono">

        <!-- =========================
             ENCABEZADO
        ========================== -->

        <header class="encabezado">

            <div class="iconos">

                <!-- PERFIL -->
                <a href="6_seccion.html"
                   class="icono-btn"
                   title="Perfil"
                   aria-label="Perfil">
                    👤
                </a>

                <!-- NOTIFICACIONES -->
                <a href="7_seccion.html"
                   class="icono-btn"
                   title="Notificaciones"
                   aria-label="Notificaciones">
                    🔔
                </a>

            </div>


            <!-- BUSCADOR -->

            <div class="buscador">

                <input
                    type="text"
                    id="buscar"
                    placeholder="Buscar materia..."
                    autocomplete="off"
                >

                <span class="lupa">⌕</span>

            </div>

        </header>


        <!-- =========================
             TÍTULO
        ========================== -->

        <h1>Menú Principal</h1>


        <!-- =========================
             MATERIAS
        ========================== -->

        <section class="grid" id="materias">


            <!-- MATERIA NUEVA -->

            <a href="8_seccion.html"
               class="card nueva">

                <div class="icono-plus">
                    +
                </div>

                <p>Materia Nueva</p>

            </a>


            <!-- FÍSICA -->

            <a href="#"
               class="card materia"
               data-materia="Física">

                <div class="imagen-materia">
                    🖼️
                </div>

                <p>Física</p>

            </a>


            <!-- QUÍMICA -->

            <a href="#"
               class="card materia"
               data-materia="Química">

                <div class="imagen-materia">
                    🖼️
                </div>

                <p>Química</p>

            </a>


            <!-- ARTÍSTICA -->

            <a href="9_seccion.html"
               class="card materia"
               data-materia="Artística">

                <div class="imagen-materia">
                    🖼️
                </div>

                <p>Artística</p>

            </a>


            <!-- MATEMÁTICAS -->

            <a href="#"
               class="card materia"
               data-materia="Matemáticas">

                <div class="imagen-materia">
                    🖼️
                </div>

                <p>Matemáticas</p>

            </a>


            <!-- FILOSOFÍA -->

            <a href="#"
               class="card materia"
               data-materia="Filosofía">

                <div class="imagen-materia">
                    🖼️
                </div>

                <p>Filosofía</p>

            </a>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           BUSCADOR
        ========================== */

        const buscador = document.getElementById("buscar");

        const materias =
            document.querySelectorAll(".materia");


        buscador.addEventListener("input", function () {

            const texto =
                this.value.toLowerCase().trim();


            materias.forEach(function (materia) {

                const nombre =
                    materia
                    .getAttribute("data-materia")
                    .toLowerCase();


                if (nombre.includes(texto)) {

                    materia.style.display = "flex";

                } else {

                    materia.style.display = "none";

                }

            });

        });


        /* =========================
           MATERIAS SIN SECCIÓN
        ========================== */

        materias.forEach(function (materia) {

            materia.addEventListener("click", function (event) {

                if (this.getAttribute("href") === "#") {

                    event.preventDefault();

                    const nombre =
                        this.getAttribute("data-materia");


                    alert(
                        "La sección de " +
                        nombre +
                        " será conectada posteriormente."
                    );

                }

            });

        });

    </script>

</body>

</html>
