<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - EduConnect</title>

    <link rel="stylesheet" href="2_seccion.css">
</head>

<body>

    <main class="app">

        <!-- ENCABEZADO -->
        <header class="header">

            <a class="icono" href="1_seccion.html">
                BACK
            </a>

            <h1>
                Inicia sesión en EduConnect
            </h1>

        </header>


        <!-- FORMULARIO -->
        <section class="login">

            <h2>
                Estudiante o maestro
            </h2>


            <!-- SELECCIONAR TIPO DE USUARIO -->

            <div class="roles">

                <a class="entrar" href="5_seccion.html"
                    type="button"
                    class="role active"
                    id="estudianteBtn"
                    onclick="seleccionarRol('estudiante')"
                >
                    Estudiante
                </a>

                <button 
                    type="button"
                    class="role"
                    id="maestroBtn"
                    onclick="seleccionarRol('maestro')"
                >
                    Maestro
                </button>

            </div>


            <!-- CORREO -->

            <label for="email">
                Correo electrónico
            </label>

            <input 
                type="email"
                id="email"
                placeholder="ejemplo@gmail.com"
            >


            <!-- CONTRASEÑA -->

            <label for="password">
                Contraseña
            </label>

            <div class="password-container">

                <input 
                    type="password"
                    id="password"
                    placeholder="Escribe tu contraseña"
                >

                <button 
                    type="button"
                    class="show-password"
                    onclick="mostrarPassword()"
                >
                    👁️
                </button>

            </div>


            <!-- PIN -->

            <label for="pin">
                Ingrese su PIN
            </label>

            <input 
                type="password"
                id="pin"
                placeholder="Escribe tu PIN"
                maxlength="6"
            >
    <!-- OLVIDASTE LA CONTRASEÑA -->

            <a class="entrar" href="3_seccion.html" 
                type="button"
                class="forgot-button"
                onclick="olvidastePassword()"
            >
                ¿Olvidaste la contraseña?
            </a>

        </section>

    </main>


    <!-- VENTANA PARA RECUPERAR CONTRASEÑA -->

    <div 
        class="modal"
        id="modalRecuperar"
    >

        <div class="modal-content">

            <button 
                class="close"
                onclick="cerrarModal()"
            >
                ×
            </button>

            <h2>
                Recuperar contraseña
            </h2>

            <p>
                Ingresa tu correo electrónico y te enviaremos
                instrucciones para recuperar tu contraseña.
            </p>

            <input 
                type="email"
                id="emailRecuperar"
                placeholder="Tu correo electrónico"
            >

            <button 
                class="recover-button"
                onclick="recuperarPassword()"
            >
                Enviar instrucciones
            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
