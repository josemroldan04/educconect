<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil</title>
<link rel="stylesheet" href="6_seccion.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

<header>
<h2>Perfil</h2>
</header>

<div class="contenido">

<img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="perfil">

<input type="text" id="nombre" placeholder="Nombre">

<input type="text" id="grado" placeholder="Grado">

<input type="text" id="codigo" placeholder="Código de estudiante">

<input type="tel" id="telefono" placeholder="Número de teléfono">

<input type="email" id="correo" placeholder="Correo electrónico">

<a class="entrar" href="5_seccion.html" onclick="guardar()">Guardar</a>

</div>

</div>

<script>

function guardar(){

let nombre=document.getElementById("nombre").value;
let grado=document.getElementById("grado").value;
let codigo=document.getElementById("codigo").value;
let telefono=document.getElementById("telefono").value;
let correo=document.getElementById("correo").value;

if(nombre==""||grado==""||codigo==""||telefono==""||correo==""){

alert("Complete todos los campos");

}else{

alert("Perfil guardado correctamente");

}

}

</script>

</body>
</html>
