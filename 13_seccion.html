<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas Artísticas</title>
<link rel="stylesheet" href="13_seccion.css">
</head>

<body>

<div class="contenedor">

    <header class="header">

        <a class="entrar" href="11_seccion.html">
             BACK
        </a>

        <h2>Tareas Artísticas</h2>

        <a class="entrar" href="5_seccion.html">
            🏠
        </a>

    </header>

    <div class="contenido">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" class="icono">

        <h1>Tarea nueva</h1>

        <form id="formulario">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre de la tarea"
                required>

            <input
                type="date"
                id="fecha"
                required>

            <textarea
                id="descripcion"
                placeholder="Descripción"
                required></textarea>

            <button type="submit" class="agregar">
                Agregar tarea
            </button>

        </form>

    </div>

</div>

<script>

function inicio(){
    alert("Regresando al inicio...");
}

document.getElementById("formulario").addEventListener("submit",function(e){

    e.preventDefault();

    let nombre=document.getElementById("nombre").value;
    let fecha=document.getElementById("fecha").value;
    let descripcion=document.getElementById("descripcion").value;

    if(nombre=="" || fecha=="" || descripcion==""){
        alert("Complete todos los campos.");
        return;
    }

    alert(
        "Tarea agregada correctamente.\n\n"+
        "Nombre: "+nombre+
        "\nFecha: "+fecha+
        "\nDescripción: "+descripcion
    );

    this.reset();

});

</script>

</body>
</html>
