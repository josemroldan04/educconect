<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas Artísticas</title>

    <link rel="stylesheet" href="12_seccion.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

    <!-- Encabezado -->

    <header class="header">

        <a class="entrar" href="11_seccion.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Tareas Artísticas</h1>

        <a class="entrar" href="5_seccion.html">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>

    <!-- Contenido -->

    <main class="contenido">

        <h2>Tus tareas</h2>

        <div class="lista">

            <div class="tarea">

                <span>Colorear dibujo</span>

                <button class="estado verde">
                    <i class="fa-solid fa-check"></i>
                </button>

            </div>

            <div class="tarea">

                <span>Delineado</span>

                <button class="estado verde">
                    <i class="fa-solid fa-check"></i>
                </button>

            </div>

            <div class="tarea">

                <span>Sombras</span>

                <button class="estado rojo">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <div class="tarea">

                <span>Paisaje</span>

                <a class="entrar" href="14_seccion.html">
                    <i class="fa-regular fa-square"></i>
                </a>

            </div>

            <div class="tarea">

                <span>Biografía</span>

                <button class="estado verde">
                    <i class="fa-solid fa-check"></i>
                </button>

            </div>

        </div>

        <a class="entrar" href="13_seccion.html">

            <i class="fa-solid fa-circle-plus"></i>

        </a>

    </main>

</div>

</body>
</html>
