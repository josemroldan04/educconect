<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Artística</title>

    <link rel="stylesheet" href="11_seccion.css">

    <!-- Iconos -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="telefono">

    <!-- Encabezado -->
    <header class="header">

        <!-- Botón Atrás -->
        <a href="artistica.html" class="btn-header">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Chat Artística</h1>

        <!-- Botón Inicio -->
        <a href="inicio.html" class="btn-header">
            <i class="fa-solid fa-house"></i>
        </a>

    </header>

    <!-- Conversación -->
    <main class="chat">

        <div class="mensaje enviado">
            Hola profesor, tengo una duda sobre la actividad.
        </div>

        <div class="mensaje recibido">
            Claro, dime cuál es tu duda y con gusto te ayudo.
        </div>

        <div class="mensaje enviado">
            ¿La pintura debe hacerse en cartulina?
        </div>

        <div class="mensaje recibido">
            Sí. Debe realizarse en cartulina tamaño pliego y entregarse el viernes.
        </div>

    </main>

    <!-- Barra inferior -->
    <footer class="footer">

        <button class="icono">
            <i class="fa-solid fa-camera"></i>
        </button>

        <button class="icono">
            <i class="fa-regular fa-image"></i>
        </button>

        <button class="icono">
            <i class="fa-solid fa-microphone"></i>
        </button>

        <input
            type="text"
            placeholder="Escribe un mensaje...">

        <button class="enviar">
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </footer>

</div>

</body>
</html>
